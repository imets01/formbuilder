<header class="bg-white text-gray-900 px-6 py-3 border-b border-gray-200 w-full">
  <div class="flex items-center justify-between gap-4">
    <!-- Logo -->
    <div class="flex items-center gap-3 flex-shrink-0 w-64">
      <button
        type="button"
        (click)="goToLanding()"
        class="flex items-center gap-2 hover:opacity-80 transition-opacity"
        title="Back to My Forms">
        <div class="w-8 h-8 rounded-md bg-blue-50 flex items-center justify-center">
          <mat-icon class="!w-5 !h-5 !text-[20px] text-blue-600">description</mat-icon>
        </div>
        <h1 class="text-lg font-semibold text-gray-900">FormBuilder</h1>
      </button>
      <button
        type="button"
        (click)="goToLanding()"
        class="inline-flex items-center gap-1 h-8 px-2 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded transition-colors"
        title="My Forms">
        <mat-icon class="!w-[16px] !h-[16px] !text-[16px]">arrow_back</mat-icon>
        My Forms
      </button>
    </div>

    <!-- Centered form title, with the import record of a form that came from a spreadsheet -->
    <div class="flex-1 max-w-xl ml-32 relative flex items-center gap-2">
      <app-import-issues class="flex-shrink-0"></app-import-issues>
      <input
        type="text"
        [ngModel]="titleDraft()"
        (ngModelChange)="onTitleInput($event)"
        (blur)="onTitleBlur()"
        placeholder="Untitled Form"
        [attr.aria-invalid]="!!titleError()"
        [attr.aria-describedby]="titleMessage() ? 'form-title-error' : null"
        class="flex-1 min-w-0 h-10 px-4 text-sm text-center text-gray-800 border rounded-md focus:outline-none focus:ring-1 transition-colors"
        [ngClass]="titleError()
          ? 'bg-red-50 border-red-400 focus:ring-red-200'
          : 'bg-gray-100 border-transparent hover:border-gray-300 focus:bg-white focus:border-blue-400 focus:ring-blue-200'" />
      <p
        *ngIf="titleMessage() as message"
        id="form-title-error"
        role="alert"
        class="absolute left-0 right-0 mt-1 text-xs text-center text-red-600">
        {{ message }}
      </p>
    </div>

    <!-- Action buttons -->
    <nav class="flex items-center gap-2 flex-shrink-0">
      <div class="flex items-center gap-1 mr-1">
        <button
          type="button"
          (click)="formState.undo()"
          [disabled]="!formState.canUndo()"
          data-tour="undo"
          title="Undo (Ctrl+Z)"
          class="inline-flex items-center justify-center w-10 h-10 text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">undo</mat-icon>
        </button>
        <button
          type="button"
          (click)="formState.redo()"
          [disabled]="!formState.canRedo()"
          title="Redo (Ctrl+Y / Ctrl+Shift+Z)"
          class="inline-flex items-center justify-center w-10 h-10 text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">redo</mat-icon>
        </button>
      </div>
      <div class="relative">
        <button
          type="button"
          [matMenuTriggerFor]="settingsMenu"
          class="inline-flex items-center gap-2 h-10 px-4 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
          <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">settings</mat-icon>
          Settings
        </button>
        <mat-menu #settingsMenu="matMenu" xPosition="before">
          <div class="px-4 py-3 space-y-3" (click)="$event.stopPropagation()">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Form Settings</p>
            <div class="flex items-center justify-between gap-6">
              <span class="text-sm text-gray-700">Disable Input Size</span>
              <mat-slide-toggle
                class="scale-75 origin-right"
                color="primary"
                [ngModel]="formState.disableInputSize()"
                (ngModelChange)="formState.disableInputSize.set($event)">
              </mat-slide-toggle>
            </div>
            <div class="flex items-center justify-between gap-6">
              <span class="text-sm text-gray-700">Disable Mouse Over</span>
              <mat-slide-toggle
                class="scale-75 origin-right"
                color="primary"
                [ngModel]="formState.disableMouseOver()"
                (ngModelChange)="formState.disableMouseOver.set($event)">
              </mat-slide-toggle>
            </div>
          </div>
        </mat-menu>
      </div>
      <button
        type="button"
        (click)="developerOpen.set(true)"
        title="Deployment settings (naming and IDs)"
        class="inline-flex items-center gap-2 h-10 px-4 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
        <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">code</mat-icon>
        Developer
      </button>
      <button
        type="button"
        (click)="preview()"
        data-tour="preview"
        class="inline-flex items-center gap-2 h-10 px-4 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors">
        <mat-icon class="!w-[18px] !h-[18px] !text-[18px]">visibility</mat-icon>
        Preview
      </button>
    </nav>
  </div>

  <app-developer-dialog [open]="developerOpen()" (closed)="developerOpen.set(false)" />
</header>
