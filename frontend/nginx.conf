server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for ES modules
    types {
        text/html                  html;
        text/css                   css;
        application/javascript     js mjs;
        application/json           json;
        image/svg+xml              svg;
        image/x-icon               ico;
        font/woff                  woff;
        font/woff2                 woff2;
    }

    # Hand API + preview traffic to the Flask backend. On Vercel this routing lives in
    # vercel.json and nginx is unused; this block is for the self-hosted Docker Compose stack,
    # where both containers share a network and the backend answers on :8080.
    #
    # A variable upstream + Docker's embedded DNS resolver means nginx resolves "backend" per
    # request, so the frontend still boots if the backend starts a moment later.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # room for imported .xlsx spec workbooks
    }

    location = /preview {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA: fall back to index.html for any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html so new deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
