<app-landing-page *ngIf="formState.view() === 'landing'"></app-landing-page>

<div *ngIf="formState.view() === 'editor'" class="h-screen w-screen flex flex-col bg-gray-50">
  <app-top-nav-bar class="w-full flex-shrink-0"></app-top-nav-bar>

  <div class="flex flex-1 w-full overflow-hidden" [class.select-none]="resizingSidebar()">
    <app-left-sidebar class="w-72 flex-shrink-0"></app-left-sidebar>
    <app-canvas class="flex-1 flex flex-col min-w-0"></app-canvas>
    <div role="separator"
         aria-orientation="vertical"
         aria-label="Resize properties panel"
         tabindex="0"
         [attr.aria-valuenow]="rightSidebarWidth()"
         [attr.aria-valuemin]="minSidebarWidth"
         [attr.aria-valuemax]="maxSidebarWidth()"
         (pointerdown)="onSidebarResizeStart($event)"
         (pointermove)="onSidebarResizeMove($event)"
         (pointerup)="onSidebarResizeEnd($event)"
         (pointercancel)="onSidebarResizeEnd($event)"
         (dblclick)="resetSidebarWidth()"
         (keydown)="onSidebarResizeKeydown($event)"
         title="Drag to resize — double-click to reset"
         class="w-1 flex-shrink-0 cursor-col-resize bg-gray-200 hover:bg-blue-400 focus:bg-blue-400 focus:outline-none transition-colors"
         [class.bg-blue-500]="resizingSidebar()"></div>
    <app-right-sidebar class="flex-shrink-0" [style.width.px]="rightSidebarWidth()"></app-right-sidebar>
  </div>
  <app-tour></app-tour>
</div>

@if (telemetry.enabled) {
  <div style="position:fixed;bottom:12px;right:12px;z-index:10000;display:flex;align-items:center;
              gap:10px;background:#111827;color:#e5e7eb;border-radius:8px;padding:8px 12px;
              box-shadow:0 4px 14px rgba(0,0,0,.35);font:500 12px/1 sans-serif;">
    <span style="opacity:.7;">telemetry</span>
    <span style="background:#065f46;color:#d1fae5;padding:3px 8px;border-radius:5px;font-weight:700;">{{ telemetry.sessionId }}</span>
    <span style="opacity:.7;">{{ telemetry.eventCount() }} events</span>
    <button type="button" (click)="telemetry.export()"
            style="background:#2563eb;color:#fff;border:none;border-radius:5px;padding:5px 10px;
                   font:600 12px sans-serif;cursor:pointer;">Export</button>
  </div>
}
