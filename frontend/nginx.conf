server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for ES modules
    types {
        text/html                  html;
        text/css                   css;
        application/javascript     js mjs;
        application/json           json;
        image/svg+xml              svg;
        image/x-icon               ico;
        font/woff                  woff;
        font/woff2                 woff2;
    }

    # Angular SPA: fall back to index.html for any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html so new deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
